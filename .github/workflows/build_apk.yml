name: Build AMAGENT Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Generate Fresh Flutter App & Build APK
        run: |
          # Backup main.dart & pubspec dependencies
          mkdir -p /tmp/amagent_src
          cp client/lib/main.dart /tmp/amagent_src/main.dart
          
          # Create clean flutter app
          flutter create --org com.amagent --project-name amagent_mobile /tmp/flutter_app
          
          # Replace main.dart
          cp /tmp/amagent_src/main.dart /tmp/flutter_app/lib/main.dart
          
          # Append dependencies to pubspec.yaml
          cat << 'EOF' >> /tmp/flutter_app/pubspec.yaml
            http: ^1.2.0
            speech_to_text: ^6.6.0
            mobile_scanner: ^5.1.1
            shared_preferences: ^2.2.3
          EOF

          # Build APK
          cd /tmp/flutter_app
          flutter pub get
          flutter build apk --release
          
          # Move output to repo
          mkdir -p $GITHUB_WORKSPACE/client/build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/client/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: amagent-release-apk
          path: client/build/app/outputs/flutter-apk/app-release.apk
